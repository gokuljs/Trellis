name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - "supabase/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "backend/**"
      - "supabase/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  quality:
    name: Backend quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install Python 3.14
        run: uv python install 3.14

      - name: Sync locked environment
        run: uv sync --locked

      - name: Run aggregate quality check
        run: make check

  web_retrieval:
    name: Public web retrieval isolation
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install Python 3.14
        run: uv python install 3.14
      - name: Sync locked environment
        run: uv sync --locked
      - name: Prove the Docker retrieval boundary
        run: uv run --locked python -m scripts.verify_web_isolation

  database:
    name: Reliable run database contracts
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: fixture
          POSTGRES_DB: trellis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: fixture
      PGDATABASE: trellis_test
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Apply migrations to a disposable database
        run: |
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/bootstrap.sql
          for migration in supabase/migrations/*.sql; do
            psql -X -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Verify acceptance, ownership, cancellation, and concurrency
        run: |
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/reliable_runs.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/run_stopping.sql
          bash supabase/tests/reliable_runs_concurrency.sh
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/web_evidence.sql
          bash supabase/tests/web_evidence_concurrency.sh
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/web_search_meter.sql
          bash supabase/tests/web_search_meter_concurrency.sh
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/web_crawl.sql
          bash supabase/tests/web_crawl_concurrency.sh
