name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - "supabase/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "backend/**"
      - "supabase/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  sql:
    name: Supabase SQL contracts
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check web schema, ownership, and import contracts
        run: |
          set -euo pipefail
          for file in \
            supabase/tests/local_bootstrap.sql \
            supabase/migrations/202610100001_web_schema.sql \
            supabase/migrations/202610100002_web_rpc.sql \
            supabase/migrations/202610100003_web_import.sql \
            supabase/migrations/202610100004_import_hardening.sql \
            supabase/migrations/202610100005_chat_summaries.sql \
            supabase/tests/schema_contract.sql \
            supabase/tests/rpc_security.sql \
            supabase/tests/runtime_rpc.sql \
            supabase/tests/import_security.sql \
            supabase/tests/import_hardening.sql \
            supabase/tests/chat_summaries.sql \
            supabase/tests/runtime_regressions.sql \
            supabase/tests/create_run_regressions.sql; do
            psql -X -v ON_ERROR_STOP=1 -f "$file"
          done

  quality:
    name: Backend quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install Python 3.14
        run: uv python install 3.14

      - name: Sync locked environment
        run: uv sync --locked

      - name: Run aggregate quality check
        run: make check
