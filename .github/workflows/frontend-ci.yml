name: Frontend CI

on:
  push:
    paths: ["frontend/**", "backend/**", "supabase/**", ".github/workflows/**"]
  pull_request:
    paths: ["frontend/**", "backend/**", "supabase/**", ".github/workflows/**"]

permissions:
  contents: read

jobs:
  durable-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TRELLIS_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      TRELLIS_WORKER_DATABASE_URL: postgresql://trellis_runtime_worker:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.13.0"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
      - name: Prepare disposable backend
        working-directory: backend
        run: |
          uv python install 3.14
          uv sync --locked
          uv run python -m tests.durable_harness bootstrap
          psql "$TRELLIS_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c "ALTER ROLE trellis_runtime_worker PASSWORD 'postgres'"
      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium
      - name: Check frontend
        working-directory: frontend
        run: |
          bun run format:check
          bun run lint
          bun run typecheck
          bun run test:contracts
          bun run build
      - name: Verify durable browser scenarios
        working-directory: frontend
        run: bun run test:browser
      - name: Save browser recordings and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: durable-browser-evidence
          path: frontend/test-results/durable/
          if-no-files-found: ignore
          retention-days: 14
